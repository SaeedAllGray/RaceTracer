name: racetracer
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  action_slider: ^0.7.0
  bloc: ^8.1.4
  cached_network_image: ^3.3.1
  dio: ^5.5.0+1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_appauth: ^6.0.6
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.3
  flip_card: ^0.7.0
  intl: ^0.19.0
  flutter_secure_storage: ^4.2.1
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.3.1
  vania: ^0.1.6+1
  image_picker: ^1.1.2
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  json_view: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
  fonts:
    - family: Courier
      fonts:
        - asset: assets/fonts/courier/courier.ttf
